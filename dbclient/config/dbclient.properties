# jFiltra DB client configuration (see dbclient/README.md)
# Contains the encryption key and maybe the database password: chmod 600 this file.

# --- jFiltra server (as in client/config/client.properties) ---
client.label=dbclient1
server.host=localhost
server.port=9000
# Placeholder - replace with your own key (at least 32 characters; generate one with: openssl rand -base64 32).
# It must match this client's entry in server/config/client_keys.properties
encryption.key=CHANGE_ME_dbclient1_secret_key_0
# Seconds to wait for the server's response
socket.timeout.seconds=120

# --- Database (put the JDBC driver JAR into dbclient/lib) ---
# PostgreSQL: jdbc:postgresql://localhost:5432/mydb
# MySQL:      jdbc:mysql://localhost:3306/mydb
# MariaDB:    jdbc:mariadb://localhost:3306/mydb
# Oracle:     jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.url=jdbc:postgresql://localhost:5432/mydb
db.user=jfiltra
# Either the password here, or the name of an environment variable that holds it
db.password=
# Transaction isolation: read_committed, repeatable_read, serializable or empty (database default).
# See README: PostgreSQL repeatable_read, Oracle serializable, MySQL/MariaDB default.
db.isolation=
#db.password.env=JFILTRA_DB_PASSWORD
# Rows fetched at a time (0 = driver default). MySQL Connector/J also needs
# ?useCursorFetch=true in db.url, otherwise it reads the whole result into memory.
db.fetch.size=1000
# Longest time for each statement in seconds, e.g. waiting for a lock (0 = no limit)
db.query.timeout.seconds=0

# One SELECT; its rows become one file. No trailing semicolon.
# Write every backslash twice (\\d for \d): .properties reads \ as an escape character.
select.sql=SELECT id, name, amount, created FROM export_queue WHERE sent = 0 ORDER BY id FOR UPDATE
# Optional: one statement run after the server confirmed the file, then everything is
# committed. Empty = none. Its consistency with select.sql is up to you (see README).
post.transfer.sql=UPDATE export_queue SET sent = 1 WHERE sent = 0

# loop: run continuously (default); once: one cycle, then exit
# (exit code 0 sent, 1 configuration error, 2 no rows, 3 transfer or post-transfer SQL failed)
run.mode=loop
# Seconds between cycles, also after rows were sent
polling.interval.seconds=10

# --- Output file ---
# csv, tsv or jsonl (one JSON object per row)
file.format=csv
# First line with the column names (csv and tsv)
file.header=true
# CSV field delimiter: one character, tab or space
csv.delimiter=,
# File name: prefix + date and time with milliseconds + extension, e.g. export_20261028-193005-123.csv
file.prefix=export_
# Directory for the file while it is written and sent (deleted afterwards)
spool.directory=spool
