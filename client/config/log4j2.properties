# Log4j 2 configuration for Client
status = warn

# jFiltra stops itself in its own shutdown hook and logs "stopped"; Log4j's hook
# would race with it. Safe to disable because every log line is flushed immediately.
shutdownHook = disable

# Shared log line format
property.logPattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Direct log messages to a log file (rolls over at 10MB, keeps 10 backups)
appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = logs/client_jfiltra.log
appender.file.filePattern = logs/client_jfiltra.log.%i
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = ${logPattern}
appender.file.policies.type = Policies
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

# Direct log messages to stdout
appender.stdout.type = Console
appender.stdout.name = Stdout
appender.stdout.target = SYSTEM_OUT
appender.stdout.layout.type = PatternLayout
appender.stdout.layout.pattern = ${logPattern}

# Root logger option
rootLogger.level = info
rootLogger.appenderRef.file.ref = File
rootLogger.appenderRef.stdout.ref = Stdout
