# Client configuration properties
client.label=client1
source.directories=/tmp/jfiltra/source1,/tmp/jfiltra/source2
server.host=localhost
server.port=9000
# Placeholder - replace with your own key (at least 32 characters; generate one with: openssl rand -base64 32).
# It must match this client's entry in server/config/client_keys.properties
encryption.key=CHANGE_ME_client1_secret_key_000
polling.interval.seconds=3
# Seconds to wait for the server's response before giving up and retrying later
socket.timeout.seconds=120
# Number of scans a file must stay unchanged before it is sent
stable.polls=2
# loop: run continuously (default); once: send one file and exit
# (exit code 0 sent, 1 configuration error, 2 nothing to send, 3 transfer failed)
run.mode=loop
# Which file is sent first: time (oldest), size (smallest) or name (A-Z); ! reverses, e.g. !time
file.order=time
# After the server stored a file: delete (default) or move it to sent/ inside its source directory
# (sent/ may be a directory or a symlink to one; a regular file named sent is never sent)
#after.send=move
# File name masks of files to send, separated by , or ; (* and ? wildcards, case-insensitive; default * sends all files)
#filemask=*.csv;report_??.txt
# File name patterns that are never sent (comma-separated, not case-sensitive; empty sends everything)
# Every comma splits patterns, even inside {a,b}; use separate patterns instead.
ignore.patterns=.*,*.part,*.tmp,*.crdownload,~$*

