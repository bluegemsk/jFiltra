# Server Configuration File

# Server listening port
server.port=9000

# Path to client encryption keys configuration file
client.keys.path=config/client_keys.properties

# Path to client storage paths configuration file
client.paths.config=config/client_paths.properties

# Seconds to wait for data from a client before closing the connection
socket.timeout.seconds=30

# Seconds a client has to send the transfer header (label, file name, hash, size)
header.timeout.seconds=5

# Maximum total seconds for one transfer, including processing on the server
transfer.timeout.seconds=600

# Maximum transfers handled at the same time, in total and per client IP address
max.connections=10
max.connections.per.ip=4

# Maximum size of a transferred file in MB (applies to both the sent and the
# uncompressed size). Raise transfer.timeout.seconds too when sending large files.
max.file.size.mb=512
