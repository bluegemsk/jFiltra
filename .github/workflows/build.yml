name: Build and smoke test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download Log4j 2
        run: |
          for d in server/lib client/lib; do
            mkdir -p "$d"
            for a in log4j-api log4j-core; do
              curl -fsSL -o "$d/$a-2.26.1.jar" "https://repo1.maven.org/maven2/org/apache/logging/log4j/$a/2.26.1/$a-2.26.1.jar"
            done
          done

      - name: Smoke test
        run: test/smoke-test.sh

  # JARs built with a new JDK must still run on Java 8
  build-new-run-java8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java8
        with:
          distribution: temurin
          java-version: 8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download Log4j 2
        run: |
          for d in server/lib client/lib; do
            mkdir -p "$d"
            for a in log4j-api log4j-core; do
              curl -fsSL -o "$d/$a-2.26.1.jar" "https://repo1.maven.org/maven2/org/apache/logging/log4j/$a/2.26.1/$a-2.26.1.jar"
            done
          done

      - name: Smoke test (built with JDK 21, run on Java 8)
        run: JFILTRA_TEST_JAVA="${{ steps.java8.outputs.path }}/bin/java" test/smoke-test.sh

  # DB client against real databases
  dbclient:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jf
          POSTGRES_PASSWORD: jfpass
          POSTGRES_DB: jf
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jf" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: jf
          MYSQL_USER: jf
          MYSQL_PASSWORD: jfpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Download Log4j 2 and JDBC drivers
        run: |
          for d in server/lib client/lib; do
            mkdir -p "$d"
            for a in log4j-api log4j-core; do
              curl -fsSL -o "$d/$a-2.26.1.jar" "https://repo1.maven.org/maven2/org/apache/logging/log4j/$a/2.26.1/$a-2.26.1.jar"
            done
          done
          mkdir -p drivers
          curl -fsSL -o drivers/postgresql.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.8/postgresql-42.7.8.jar
          curl -fsSL -o drivers/mysql.jar https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.4.0/mysql-connector-j-9.4.0.jar

      - name: DB client smoke test (PostgreSQL)
        run: test/dbclient-smoke-test.sh
        env:
          JFILTRA_DB_URL: jdbc:postgresql://127.0.0.1:5432/jf
          JFILTRA_DB_USER: jf
          JFILTRA_DB_PASSWORD: jfpass
          JFILTRA_DB_DRIVER: drivers/postgresql.jar

      - name: DB client smoke test (MySQL)
        run: test/dbclient-smoke-test.sh
        env:
          JFILTRA_DB_URL: jdbc:mysql://127.0.0.1:3306/jf
          JFILTRA_DB_USER: jf
          JFILTRA_DB_PASSWORD: jfpass
          JFILTRA_DB_DRIVER: drivers/mysql.jar
          JFILTRA_DB_TYPES: DECIMAL(12,2) DATETIME(3) TEXT
